<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>遊學支出小管家</title>
<style>
  :root{
    --bg:#F3E9DA;
    --card:#FFFCF7;
    --ink:#4A3728;
    --ink2:#A5876B;
    --line:#E9DCC6;
    --accent:#B0805A;
    --good:#8CA06B;
    --warn:#D8A13B;
    --bad:#C6604A;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;}
  body{padding-bottom:40px;}
  .wrap{max-width:480px; margin:0 auto; padding:20px 16px 8px;}
  h1{font-size:17px; font-weight:600; margin:0; letter-spacing:.2px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .tripname{display:flex; flex-direction:column; gap:2px;}
  .tripname span{font-size:12px; color:var(--ink2); font-weight:500;}
  .gear{width:34px; height:34px; border-radius:50%; background:var(--card); border:none;
    display:flex; align-items:center; justify-content:center; box-shadow:0 1px 2px rgba(0,0,0,.06); cursor:pointer;}
  .gear svg{width:17px; height:17px;}

  .card{background:var(--card); border-radius:var(--radius); padding:18px;
    box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:14px;}

  .ringcard{display:flex; align-items:center; gap:18px;}
  .ringbox{position:relative; width:128px; height:128px; flex:none;}
  .ringbox svg{transform:rotate(-90deg); width:128px; height:128px;}
  .ringbox .center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .ringbox .center .amt{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;}
  .ringbox .center .lbl{font-size:11px; color:var(--ink2); margin-top:2px;}
  .ringinfo{flex:1; min-width:0;}
  .ringinfo .row{display:flex; justify-content:space-between; font-size:13px; padding:4px 0;}
  .ringinfo .row .k{color:var(--ink2);}
  .ringinfo .row .v{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; font-weight:600;}
  .status-chip{display:inline-block; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; margin-top:6px;}
  .status-good{background:rgba(140,160,107,.16); color:var(--good);}
  .status-warn{background:rgba(216,161,59,.16); color:#9C6E1E;}
  .status-bad{background:rgba(198,96,74,.14); color:var(--bad);}

  .alert{display:flex; align-items:center; gap:10px; background:rgba(198,96,74,.10);
    border:1px solid rgba(198,96,74,.28); border-radius:14px; padding:12px 14px; margin-bottom:14px;
    font-size:13px; color:#8B3F2D; font-weight:500;}
  .alert svg{flex:none; width:18px; height:18px;}

  .section-title{font-size:13px; font-weight:600; color:var(--ink2); margin:0 0 10px 2px; text-transform:uppercase; letter-spacing:.4px;}

  .cats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
  .cat-btn{border:1.5px solid var(--line); background:#F7EFE2; border-radius:14px; padding:9px 4px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; color:var(--ink); cursor:pointer;}
  .cat-btn .ic{font-size:18px;}
  .cat-btn.active{border-color:var(--accent); background:rgba(91,95,239,.08); color:var(--accent); font-weight:600;}

  .amtrow{display:flex; gap:8px; margin-bottom:8px;}
  .amtrow input[type=number]{flex:1; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px;
    font-size:17px; font-family:ui-monospace,"SF Mono",Menlo,monospace; font-weight:600; color:var(--ink);}
  .amtrow input[type=text]{border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:14px; width:100%; margin-bottom:8px;}
  input:focus{outline:none; border-color:var(--accent);}
  .addbtn{width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:600; cursor:pointer;}
  .addbtn:active{opacity:.85;}

  .daystrip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px 4px;}
  .daychip{flex:none; width:52px; height:60px; border-radius:14px; border:1.5px solid var(--line); background:#F7EFE2;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; font-size:11px; color:var(--ink2);}
  .daychip.sel{border-color:var(--accent); background:rgba(91,95,239,.08);}
  .daychip .d{font-weight:700; font-size:14px; color:var(--ink);}
  .dot{width:6px; height:6px; border-radius:50%;}
  .dot-good{background:var(--good);} .dot-warn{background:var(--warn);} .dot-bad{background:var(--bad);} .dot-none{background:var(--line);}

  .brk-row{display:flex; align-items:center; gap:10px; padding:8px 0;}
  .brk-ic{width:28px; height:28px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex:none;}
  .brk-mid{flex:1; min-width:0;}
  .brk-top{display:flex; justify-content:space-between; font-size:13px; margin-bottom:5px;}
  .brk-top .name{font-weight:600;}
  .brk-top .amt{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums; color:var(--ink2);}
  .brk-bar{height:6px; border-radius:4px; background:#EEDFC6; overflow:hidden;}
  .brk-bar .fill{height:100%; border-radius:4px;}
  .brk-pct{flex:none; width:40px; text-align:right; font-size:12px; font-weight:700; color:var(--ink2); font-variant-numeric:tabular-nums;}

  .exp-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .exp-row:last-child{border-bottom:none;}
  .exp-ic{width:34px; height:34px; border-radius:10px; background:#F1E6D3; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none;}
  .exp-mid{flex:1; min-width:0;}
  .exp-cat{font-size:13px; font-weight:600;}
  .exp-note{font-size:12px; color:var(--ink2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .exp-amt{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-weight:600; font-size:14px; font-variant-numeric:tabular-nums;}
  .exp-del{border:none; background:none; color:var(--ink2); font-size:18px; padding:0 2px; cursor:pointer;}
  .empty{text-align:center; color:var(--ink2); font-size:13px; padding:20px 0;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; z-index:50;}
  .sheet{background:var(--card); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:20px 18px 26px; max-height:88vh; overflow-y:auto;}
  .sheet h2{font-size:17px; margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{font-size:12px; color:var(--ink2); display:block; margin-bottom:6px; font-weight:600;}
  .field input, .field select{width:100%; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:15px; color:var(--ink); background:#F7EFE2;}
  .field .two{display:flex; gap:10px;}
  .field .two > *{flex:1;}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .btn-secondary{flex:1; background:#F1E6D3; color:var(--ink); border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:600; cursor:pointer;}
  .btn-primary{flex:2; background:var(--accent); color:#fff; border:none; border-radius:12px; padding:12px; font-size:15px; font-weight:600; cursor:pointer;}
  .danger-link{display:block; text-align:center; color:var(--bad); font-size:13px; margin-top:16px; background:none; border:none; cursor:pointer;}

  @media (prefers-reduced-motion:no-preference){
    .ring-fg{transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1);}
    .card{animation:fadein .3s ease both;}
  }
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const OLD_STORAGE_KEY = 'trip-budget-v1';
const CATS = [
  {id:'breakfast', ic:'🥐', name:'早餐'},
  {id:'lunch', ic:'🍱', name:'午餐'},
  {id:'snack', ic:'🍡', name:'點心'},
  {id:'dinner', ic:'🍚', name:'晚餐'},
  {id:'transport', ic:'🚌', name:'車費'},
  {id:'other', ic:'✨', name:'其他'},
];
const CURRENCIES = {TWD:'NT$', PHP:'₱', AUD:'A$', USD:'$', JPY:'¥', EUR:'€', GBP:'£', CNY:'¥', KRW:'₩', NZD:'NZ$', SGD:'S$'};
const CAT_COLOR = {breakfast:'#C97C48', lunch:'#B0805A', snack:'#D8A13B', dinner:'#8A5A3C', transport:'#7C93A3', other:'#A5876B'};

const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined');
async function storageGet(key){
  if(HAS_CLAUDE_STORAGE){
    try{ return await window.storage.get(key, false); }catch(e){ return null; }
  }
  const raw = localStorage.getItem(key);
  return raw!==null ? {value:raw} : null;
}
async function storageSet(key, value){
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.set(key, value, false); }catch(e){ console.error('storage save failed', e); }
    return;
  }
  try{ localStorage.setItem(key, value); }catch(e){ console.error('storage save failed', e); }
}
async function storageDelete(key){
  if(HAS_CLAUDE_STORAGE){
    try{ await window.storage.delete(key, false); }catch(e){ console.error('storage delete failed', e); }
    return;
  }
  try{ localStorage.removeItem(key); }catch(e){ console.error('storage delete failed', e); }
}

let state = null; // {config, expenses} of the CURRENT trip
let tripsIndex = []; // [{id, name}]
let currentTripId = null;
let ui = { selectedCat: 'breakfast', selectedDate: todayStr(), showSetup: false, creatingNewTrip: false, editingId: null, editCat: null, showTripSwitch: false };

function todayStr(d=new Date()){
  const tz = new Date(d.getTime() - d.getTimezoneOffset()*60000);
  return tz.toISOString().slice(0,10);
}
function dayDiff(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
function sym(){ return CURRENCIES[state.config.currency] || (state.config.currency+' '); }

async function loadTripData(id){
  const res = await storageGet('trip:'+id);
  return res ? JSON.parse(res.value) : {config:null, expenses:[]};
}

async function load(){
  const idxRes = await storageGet('trips-index');
  tripsIndex = idxRes ? JSON.parse(idxRes.value) : null;

  if(tripsIndex === null){
    // first run: try migrating old single-trip data
    let migrated = null;
    const old = await storageGet(OLD_STORAGE_KEY);
    if(old){ try{ migrated = JSON.parse(old.value); }catch(e){ migrated = null; } }
    if(migrated && migrated.config){
      const id = 'trip_'+Date.now();
      tripsIndex = [{id, name: migrated.config.name}];
      await storageSet('trip:'+id, JSON.stringify(migrated));
      await storageSet('trips-index', JSON.stringify(tripsIndex));
      currentTripId = id;
      await storageSet('current-trip', JSON.stringify(id));
    } else {
      tripsIndex = [];
    }
  }

  if(currentTripId === null){
    const cur = await storageGet('current-trip');
    currentTripId = cur ? JSON.parse(cur.value) : null;
  }
  if((!currentTripId || !tripsIndex.find(t=>t.id===currentTripId)) && tripsIndex.length){
    currentTripId = tripsIndex[0].id;
  }

  state = currentTripId ? await loadTripData(currentTripId) : {config:null, expenses:[]};

  if(!state.config){ ui.showSetup = true; ui.creatingNewTrip = true; }
  render();
}

async function save(){
  if(!currentTripId) return;
  await storageSet('trip:'+currentTripId, JSON.stringify(state));
  const idxEntry = tripsIndex.find(t=>t.id===currentTripId);
  if(idxEntry && state.config && idxEntry.name !== state.config.name){
    idxEntry.name = state.config.name;
    await storageSet('trips-index', JSON.stringify(tripsIndex));
  }
}

function computeStats(){
  const c = state.config;
  const totalDays = dayDiff(c.startDate, c.endDate) + 1;
  const rawIdx = dayDiff(c.startDate, todayStr());
  const todayIdx = Math.min(Math.max(rawIdx,0), totalDays-1);
  const totalSpent = state.expenses.reduce((s,e)=>s+e.amount,0);
  const totalRemaining = c.totalBudget - totalSpent;
  const originalDaily = c.totalBudget / totalDays;

  const spentBeforeToday = state.expenses
    .filter(e=>e.date < todayStr())
    .reduce((s,e)=>s+e.amount,0);
  const daysRemainingFromToday = Math.max(totalDays - todayIdx, 1);
  const adjustedDaily = (c.totalBudget - spentBeforeToday) / daysRemainingFromToday;

  const todaySpent = state.expenses.filter(e=>e.date===todayStr()).reduce((s,e)=>s+e.amount,0);

  return {totalDays, todayIdx, totalSpent, totalRemaining, originalDaily, adjustedDaily, todaySpent, spentBeforeToday};
}

function computeCategoryBreakdown(){
  const totals = {};
  let grand = 0;
  state.expenses.forEach(e=>{
    totals[e.cat] = (totals[e.cat]||0) + e.amount;
    grand += e.amount;
  });
  return CATS
    .map(c=>({...c, total: totals[c.id]||0}))
    .filter(c=>c.total>0)
    .sort((a,b)=>b.total-a.total)
    .map(c=>({...c, pct: grand>0 ? (c.total/grand*100) : 0}));
}

function statusOf(spent, budget){
  if(budget<=0) return 'bad';
  const pct = spent/budget;
  if(pct > 1) return 'bad';
  if(pct >= 0.8) return 'warn';
  return 'good';
}
function statusColor(s){ return s==='bad'?'var(--bad)': s==='warn'?'var(--warn)':'var(--good)'; }

function ring(pct, colorVar, centerHtml){
  const r = 54, c = 2*Math.PI*r;
  const clamped = Math.min(pct,1);
  const offset = c * (1-clamped);
  return `
  <div class="ringbox">
    <svg viewBox="0 0 128 128">
      <circle cx="64" cy="64" r="${r}" fill="none" stroke="#EAD9BF" stroke-width="12"/>
      <circle class="ring-fg" cx="64" cy="64" r="${r}" fill="none" stroke="${colorVar}" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <div class="center">${centerHtml}</div>
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(ui.showSetup){ app.innerHTML = setupScreen(); bindSetup(); return; }
  if(!state.config){ ui.showSetup = true; return render(); }

  const s = computeStats();
  const todayStatus = statusOf(s.todaySpent, s.adjustedDaily);
  const overallStatus = s.totalSpent > state.config.totalBudget ? 'bad' : (s.totalRemaining < state.config.totalBudget*0.1 ? 'warn':'good');

  let alertHtml = '';
  if(overallStatus==='bad'){
    alertHtml = `<div class="alert">⚠️ <div>總預算已超支 <b>${sym()}${fmt(s.totalSpent-state.config.totalBudget)}</b>，建議接下來幾天縮減開銷。</div></div>`;
  } else if(todayStatus==='bad'){
    alertHtml = `<div class="alert">⚠️ <div>今天已超出調整後的每日額度 <b>${sym()}${fmt(s.todaySpent-s.adjustedDaily)}</b>。</div></div>`;
  }

  const totalDays = s.totalDays;
  const dayChips = [];
  for(let i=0;i<totalDays;i++){
    const dt = new Date(state.config.startDate);
    dt.setDate(dt.getDate()+i);
    const ds = todayStr(dt);
    const daySpent = state.expenses.filter(e=>e.date===ds).reduce((a,e)=>a+e.amount,0);
    let dotClass = 'dot-none';
    if(ds <= todayStr()){
      const st = statusOf(daySpent, s.originalDaily);
      dotClass = 'dot-'+st;
    }
    const label = `${dt.getMonth()+1}/${dt.getDate()}`;
    dayChips.push(`<div class="daychip ${ds===ui.selectedDate?'sel':''}" data-date="${ds}">
      <div class="dot ${dotClass}"></div>
      <div class="d">${label}</div>
    </div>`);
  }

  const breakdown = computeCategoryBreakdown();
  const breakdownHtml = breakdown.length ? breakdown.map(c=>`
    <div class="brk-row">
      <div class="brk-ic" style="background:${c.color?c.color:CAT_COLOR[c.id]}22;">${c.ic}</div>
      <div class="brk-mid">
        <div class="brk-top"><span class="name">${c.name}</span><span class="amt">${sym()}${fmt(c.total)}</span></div>
        <div class="brk-bar"><div class="fill" style="width:${c.pct}%; background:${CAT_COLOR[c.id]};"></div></div>
      </div>
      <div class="brk-pct">${c.pct.toFixed(0)}%</div>
    </div>
  `).join('') : `<div class="empty">還沒有支出資料</div>`;

  const selExpenses = state.expenses.filter(e=>e.date===ui.selectedDate).sort((a,b)=>b.ts-a.ts);
  const selDaySpent = selExpenses.reduce((a,e)=>a+e.amount,0);
  const isToday = ui.selectedDate === todayStr();

  const expRows = selExpenses.length ? selExpenses.map(e=>{
    const cat = CATS.find(c=>c.id===e.cat) || CATS[CATS.length-1];
    return `<div class="exp-row" data-editid="${e.id}">
      <div class="exp-ic">${cat.ic}</div>
      <div class="exp-mid">
        <div class="exp-cat">${cat.name}</div>
        ${e.note?`<div class="exp-note">${escapeHtml(e.note)}</div>`:''}
      </div>
      <div class="exp-amt">${sym()}${fmt(e.amount)}</div>
      <button class="exp-del" data-id="${e.id}">✕</button>
    </div>`;
  }).join('') : `<div class="empty">這天還沒有支出紀錄</div>`;

  app.innerHTML = `
    <div class="topbar">
      <div class="tripname" id="btn-tripswitch" style="cursor:pointer;">
        <h1>${escapeHtml(state.config.name)}${tripsIndex.length>1?' ▾':''}</h1>
        <span>第 ${s.todayIdx+1} / ${totalDays} 天 · ${state.config.startDate} ~ ${state.config.endDate}</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="gear" id="btn-export" title="匯出 CSV">${exportSvg()}</button>
        <button class="gear" id="btn-settings">${gearSvg()}</button>
      </div>
    </div>

    ${alertHtml}

    <div class="card ringcard">
      ${ring(s.adjustedDaily>0? s.todaySpent/s.adjustedDaily : 1, statusColor(todayStatus),
        `<div class="amt">${sym()}${fmt(s.todaySpent)}</div><div class="lbl">今日已花</div>`)}
      <div class="ringinfo">
        <div class="row"><span class="k">今日調整額度</span><span class="v">${sym()}${fmt(s.adjustedDaily)}</span></div>
        <div class="row"><span class="k">原始每日預算</span><span class="v">${sym()}${fmt(s.originalDaily)}</span></div>
        <div class="row"><span class="k">總預算剩餘</span><span class="v" style="color:${overallStatus==='bad'?'var(--bad)':'var(--ink)'}">${sym()}${fmt(s.totalRemaining)}</span></div>
        <span class="status-chip status-${todayStatus}">${todayStatus==='good'?'進度正常': todayStatus==='warn'?'接近上限':'已超支'}</span>
      </div>
    </div>

    <div class="card">
      <div class="section-title">分類佔比 · 總花費 ${sym()}${fmt(s.totalSpent)}</div>
      ${breakdownHtml}
    </div>

    <div class="card">
      <div class="section-title">記一筆支出</div>
      <div class="cats">
        ${CATS.map(c=>`<div class="cat-btn ${ui.selectedCat===c.id?'active':''}" data-cat="${c.id}">
          <span class="ic">${c.ic}</span><span>${c.name}</span>
        </div>`).join('')}
      </div>
      <div class="amtrow">
        <input type="number" inputmode="decimal" id="in-amt" placeholder="金額">
      </div>
      <input type="text" id="in-note" placeholder="${ui.selectedCat==='other' ? '請說明是什麼支出（必填）' : '備註（選填）'}">
      <button class="addbtn" id="btn-add">加入今天的支出</button>
    </div>

    <div class="card">
      <div class="section-title">每日紀錄</div>
      <div class="daystrip">${dayChips.join('')}</div>
      <div style="display:flex; justify-content:space-between; font-size:13px; color:var(--ink2); margin-bottom:6px;">
        <span>${isToday?'今天':ui.selectedDate} 支出</span>
        <span style="font-weight:600; color:var(--ink); font-family:ui-monospace,'SF Mono',Menlo,monospace;">${sym()}${fmt(selDaySpent)}</span>
      </div>
      ${expRows}
    </div>
    ${ui.editingId ? editSheet() : ''}
    ${ui.showTripSwitch ? tripSwitchSheet() : ''}
  `;

  bindMain();
}

function editSheet(){
  const e = state.expenses.find(x=>x.id===ui.editingId);
  if(!e) { ui.editingId = null; return ''; }
  const editCat = ui.editCat || e.cat;
  return `
  <div class="overlay" id="edit-overlay">
    <div class="sheet">
      <h2>修改這筆支出</h2>
      <div class="cats">
        ${CATS.map(c=>`<div class="cat-btn ${editCat===c.id?'active':''}" data-editcat="${c.id}">
          <span class="ic">${c.ic}</span><span>${c.name}</span>
        </div>`).join('')}
      </div>
      <div class="amtrow">
        <input type="number" inputmode="decimal" id="edit-amt" value="${e.amount}" placeholder="金額">
      </div>
      <input type="text" id="edit-note" value="${e.note?escapeHtml(e.note):''}"
        placeholder="${editCat==='other' ? '請說明是什麼支出（必填）' : '備註（選填）'}">
      <div class="sheet-actions">
        <button class="btn-secondary" id="btn-cancel-edit">取消</button>
        <button class="btn-primary" id="btn-save-edit">儲存修改</button>
      </div>
      <button class="danger-link" id="btn-delete-edit">刪除這筆支出</button>
    </div>
  </div>`;
}

function tripSwitchSheet(){
  return `
  <div class="overlay" id="tripswitch-overlay">
    <div class="sheet">
      <h2>切換遊學團</h2>
      ${tripsIndex.map(t=>`
        <div class="brk-row" data-tripid="${t.id}" style="cursor:pointer; justify-content:space-between;">
          <div style="display:flex; align-items:center; gap:10px; min-width:0;">
            <div class="brk-ic" style="background:${t.id===currentTripId?'rgba(176,128,90,.22)':'#F1E6D3'};">${t.id===currentTripId?'✓':'🧳'}</div>
            <span style="font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(t.name)}</span>
          </div>
          <button class="exp-del" data-deltrip="${t.id}">✕</button>
        </div>
      `).join('')}
      <button class="btn-primary" id="btn-new-trip" style="width:100%; margin-top:10px;">+ 新增遊學團</button>
      <button class="danger-link" id="btn-close-tripswitch">關閉</button>
    </div>
  </div>`;
}

function exportSvg(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="#4A3728" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>`; }

function csvEscape(v){
  const s = String(v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function exportCSV(){
  const rows = [['日期','分類','金額','備註']];
  const sorted = [...state.expenses].sort((a,b)=> a.date===b.date ? a.ts-b.ts : (a.date<b.date?-1:1));
  sorted.forEach(e=>{
    const cat = CATS.find(c=>c.id===e.cat);
    rows.push([e.date, cat?cat.name:e.cat, e.amount, e.note||'']);
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${state.config.name}_支出紀錄_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function escapeHtml(s){ const d=document.createElement('div'); d.innerText=s; return d.innerHTML; }
function gearSvg(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1 1.55V21a2 2 0 11-4 0v-.09A1.7 1.7 0 009 19.4a1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.55-1H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6a1.7 1.7 0 001-1.55V3a2 2 0 114 0v.09a1.7 1.7 0 001 1.55 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9a1.7 1.7 0 001.55 1H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.55 1z"/></svg>`; }

function setupScreen(){
  const c = ui.creatingNewTrip ? {} : (state.config || {});
  const title = ui.creatingNewTrip ? '新增遊學團' : '編輯行程設定';
  const showCancel = tripsIndex.length > 0;
  return `
  <div class="topbar"><h1>${title}</h1></div>
  <div class="card">
    <div class="field"><label>行程名稱</label><input id="s-name" value="${c.name?escapeHtml(c.name):''}" placeholder="例如：2026 澳洲遊學"></div>
    <div class="field two">
      <div><label>出發日</label><input id="s-start" type="date" value="${c.startDate||todayStr()}"></div>
      <div><label>回程日</label><input id="s-end" type="date" value="${c.endDate||''}"></div>
    </div>
    <div class="field two">
      <div><label>總預算</label><input id="s-budget" type="number" inputmode="decimal" value="${c.totalBudget||''}" placeholder="例如：60000"></div>
      <div><label>幣別</label>
        <select id="s-currency">
          ${Object.keys(CURRENCIES).map(k=>`<option value="${k}" ${c.currency===k?'selected':''}>${k}（${CURRENCIES[k]}）</option>`).join('')}
        </select>
      </div>
    </div>
    <button class="btn-primary" id="btn-save-setup" style="width:100%;">${ui.creatingNewTrip ? '建立這個遊學團' : '儲存設定'}</button>
    ${showCancel ? `<button class="danger-link" id="btn-cancel-setup">取消</button>` : ''}
  </div>
  `;
}

function bindSetup(){
  document.getElementById('btn-save-setup').onclick = async ()=>{
    const name = document.getElementById('s-name').value.trim() || '我的遊學行程';
    const startDate = document.getElementById('s-start').value;
    const endDate = document.getElementById('s-end').value;
    const totalBudget = parseFloat(document.getElementById('s-budget').value);
    const currency = document.getElementById('s-currency').value;
    if(!startDate || !endDate || !(totalBudget>0)){
      alert('請完整填寫日期與總預算'); return;
    }
    if(endDate < startDate){ alert('回程日不能早於出發日'); return; }
    const newConfig = {name, startDate, endDate, totalBudget, currency};

    if(ui.creatingNewTrip){
      const id = 'trip_'+Date.now();
      currentTripId = id;
      state = {config:newConfig, expenses:[]};
      tripsIndex.push({id, name});
      await storageSet('current-trip', JSON.stringify(id));
      await storageSet('trips-index', JSON.stringify(tripsIndex));
    } else {
      state.config = newConfig;
    }
    ui.showSetup = false;
    ui.creatingNewTrip = false;
    ui.selectedDate = todayStr();
    await save();
    render();
  };
  const cancelBtn = document.getElementById('btn-cancel-setup');
  if(cancelBtn) cancelBtn.onclick = ()=>{
    ui.showSetup = false;
    ui.creatingNewTrip = false;
    render();
  };
}

function bindMain(){
  document.getElementById('btn-settings').onclick = ()=>{ ui.showSetup = true; ui.creatingNewTrip = false; render(); };
  document.getElementById('btn-export').onclick = ()=>{ exportCSV(); };
  document.getElementById('btn-tripswitch').onclick = ()=>{ ui.showTripSwitch = true; render(); };

  document.querySelectorAll('.cat-btn').forEach(el=>{
    el.onclick = ()=>{ ui.selectedCat = el.dataset.cat; render(); document.getElementById('in-amt').focus(); };
  });

  document.getElementById('btn-add').onclick = async ()=>{
    const amtEl = document.getElementById('in-amt');
    const noteEl = document.getElementById('in-note');
    const amount = parseFloat(amtEl.value);
    if(!(amount>0)){ amtEl.focus(); return; }
    const note = noteEl.value.trim();
    if(ui.selectedCat==='other' && !note){
      alert('選「其他」時，請在備註填寫這筆是什麼支出');
      noteEl.focus();
      return;
    }
    state.expenses.push({
      id: 'e'+Date.now()+Math.random().toString(36).slice(2,6),
      date: todayStr(),
      amount, cat: ui.selectedCat,
      note,
      ts: Date.now()
    });
    ui.selectedDate = todayStr();
    await save();
    render();
  };

  document.querySelectorAll('.daychip').forEach(el=>{
    el.onclick = ()=>{ ui.selectedDate = el.dataset.date; render(); };
  });

  document.querySelectorAll('.exp-row').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      if(ev.target.closest('.exp-del')) return;
      ui.editingId = el.dataset.editid;
      ui.editCat = null;
      render();
    });
  });

  document.querySelectorAll('.exp-del').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      state.expenses = state.expenses.filter(e=>e.id!==el.dataset.id);
      await save();
      render();
    });
  });

  bindEditSheet();
  bindTripSwitch();
}

function bindEditSheet(){
  if(!ui.editingId) return;
  document.querySelectorAll('#edit-overlay .cat-btn').forEach(el=>{
    el.onclick = ()=>{ ui.editCat = el.dataset.editcat; render(); };
  });
  document.getElementById('btn-cancel-edit').onclick = ()=>{
    ui.editingId = null; ui.editCat = null; render();
  };
  document.getElementById('btn-delete-edit').onclick = async ()=>{
    if(!confirm('確定要刪除這筆支出嗎？')) return;
    state.expenses = state.expenses.filter(e=>e.id!==ui.editingId);
    ui.editingId = null; ui.editCat = null;
    await save();
    render();
  };
  document.getElementById('btn-save-edit').onclick = async ()=>{
    const amtEl = document.getElementById('edit-amt');
    const noteEl = document.getElementById('edit-note');
    const amount = parseFloat(amtEl.value);
    if(!(amount>0)){ amtEl.focus(); return; }
    const cat = ui.editCat || state.expenses.find(x=>x.id===ui.editingId).cat;
    const note = noteEl.value.trim();
    if(cat==='other' && !note){
      alert('選「其他」時，請在備註填寫這筆是什麼支出');
      noteEl.focus();
      return;
    }
    const idx = state.expenses.findIndex(x=>x.id===ui.editingId);
    if(idx>-1){
      state.expenses[idx] = {...state.expenses[idx], amount, cat, note};
    }
    ui.editingId = null; ui.editCat = null;
    await save();
    render();
  };
}

function bindTripSwitch(){
  if(!ui.showTripSwitch) return;
  document.getElementById('btn-close-tripswitch').onclick = ()=>{ ui.showTripSwitch = false; render(); };
  document.getElementById('btn-new-trip').onclick = ()=>{
    ui.showTripSwitch = false; ui.creatingNewTrip = true; ui.showSetup = true; render();
  };
  document.querySelectorAll('#tripswitch-overlay [data-tripid]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      if(ev.target.closest('[data-deltrip]')) return;
      const id = el.dataset.tripid;
      ui.showTripSwitch = false;
      if(id !== currentTripId){
        currentTripId = id;
        await storageSet('current-trip', JSON.stringify(id));
        state = await loadTripData(id);
        ui.selectedDate = todayStr();
      }
      render();
    });
  });
  document.querySelectorAll('[data-deltrip]').forEach(el=>{
    el.addEventListener('click', async (ev)=>{
      ev.stopPropagation();
      const id = el.dataset.deltrip;
      const t = tripsIndex.find(x=>x.id===id);
      if(!confirm(`確定要刪除「${t?t.name:'這個遊學團'}」的所有資料嗎？此動作無法復原。`)) return;
      tripsIndex = tripsIndex.filter(x=>x.id!==id);
      await storageDelete('trip:'+id);
      await storageSet('trips-index', JSON.stringify(tripsIndex));
      if(id === currentTripId){
        if(tripsIndex.length){
          currentTripId = tripsIndex[0].id;
          await storageSet('current-trip', JSON.stringify(currentTripId));
          state = await loadTripData(currentTripId);
        } else {
          currentTripId = null;
          state = {config:null, expenses:[]};
          ui.showTripSwitch = false;
          ui.creatingNewTrip = true;
          ui.showSetup = true;
          render();
          return;
        }
      }
      render();
    });
  });
}

load();
</script>
</body>
</html>
